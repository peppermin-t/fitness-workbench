[package]
name = "fitness_workbench"
version = "0.8.1"
description = "Local-first personal training workbench"
authors = ["fitness-workbench"]
edition = "2021"

[lib]
name = "fitness_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
